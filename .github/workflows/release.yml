name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run for an existing tag: re-derives the notes from CHANGELOG.md
  # and updates the release in place. Useful for fixing notes after a typo,
  # and for exercising this workflow without cutting a throwaway tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.4.1"
        required: true
        type: string
  # Called by tag-on-version-bump.yml. A tag pushed with GITHUB_TOKEN does not
  # trigger workflows, so that job invokes this one directly instead of
  # relying on its own tag push to fire the `push: tags` trigger above.
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the tagged commit, not the default branch, so the tests
          # and version check run against what the release actually contains.
          # On a tag push this is the tag; on manual dispatch, the input.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      # A tag that fails its own test suite must not become a release.
      - name: Run tests
        run: uv run pytest -q

      # The tag and pyproject.toml must agree, or the release page will
      # advertise a version the package does not report.
      - name: Check tag matches pyproject version
        run: |
          tag="${TAG#v}"
          proj="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag $TAG implies version $tag but pyproject.toml declares $proj"
            exit 1
          fi
          echo "version $proj matches tag $TAG"

      # Prefer the matching version section in CHANGELOG.md. The Unreleased
      # section remains a fallback for the next release while its notes are
      # being prepared. Curated notes are prepended to GitHub's auto-generated
      # full changelog.
      - name: Extract curated notes from CHANGELOG
        run: |
          python3 - "$TAG" <<'PY' > curated-notes.md
          import pathlib
          import re
          import sys

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = sys.argv[1].removeprefix("v")

          def section(name: str) -> str:
              match = re.search(
                  rf"^## \[{re.escape(name)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                  changelog,
                  flags=re.MULTILINE | re.DOTALL,
              )
              return match.group(1).strip() if match else ""

          notes = section(version) or section("Unreleased")
          print(notes)
          PY
          if [ ! -s curated-notes.md ]; then
            echo "::warning::no curated notes for $TAG or under [Unreleased] — using auto-generated notes only"
          fi
          echo "--- curated notes ---"
          cat curated-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — regenerating notes."
            # gh release edit has no --generate-notes, so regenerate the full
            # changelog via the API, prepend the curated notes, and update.
            gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq '.body' > auto-notes.md
            cat curated-notes.md auto-notes.md > release-notes.md
            gh release edit "$TAG" --notes-file release-notes.md
          else
            # --notes-file prepends the curated sections; --generate-notes
            # appends the auto-generated full changelog.
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file curated-notes.md \
              --generate-notes \
              --latest
          fi
