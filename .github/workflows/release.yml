name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      # A tag that fails its own test suite must not become a release.
      - name: Run tests
        run: uv run pytest -q

      # The tag and pyproject.toml must agree, or the release page will
      # advertise a version the package does not report.
      - name: Check tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag but pyproject.toml declares $proj"
            exit 1
          fi
          echo "version $proj matches tag $GITHUB_REF_NAME"

      # Notes come verbatim from CHANGELOG.md so the release page and the
      # changelog cannot drift apart.
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="$version" '
            /^## \[/ {
              if (found) exit
              line = $0
              sub(/^## \[/, "", line)
              sub(/\].*$/, "", line)
              if (line == want) { found = 1 }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Drop leading/trailing blank lines only — interior blanks separate
          # the "### Fixed" / "### Changed" headings and must survive.
          python3 -c 'import pathlib; p = pathlib.Path("release-notes.md"); p.write_text(p.read_text().strip() + "\n")'
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG.md section found for [$version] — add one before tagging"
            exit 1
          fi
          echo "--- notes ---"
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists — updating notes."
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --latest
          fi
