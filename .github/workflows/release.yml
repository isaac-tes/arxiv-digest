name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run for an existing tag: re-derives the notes from CHANGELOG.md
  # and updates the release in place. Useful for fixing notes after a typo,
  # and for exercising this workflow without cutting a throwaway tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.4.1"
        required: true
        type: string
  # Called by tag-on-version-bump.yml. A tag pushed with GITHUB_TOKEN does not
  # trigger workflows, so that job invokes this one directly instead of
  # relying on its own tag push to fire the `push: tags` trigger above.
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the tagged commit, not the default branch, so the tests
          # and version check run against what the release actually contains.
          # On a tag push this is the tag; on manual dispatch, the input.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      # A tag that fails its own test suite must not become a release.
      - name: Run tests
        run: uv run pytest -q

      # The tag and pyproject.toml must agree, or the release page will
      # advertise a version the package does not report.
      - name: Check tag matches pyproject version
        run: |
          tag="${TAG#v}"
          proj="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag $TAG implies version $tag but pyproject.toml declares $proj"
            exit 1
          fi
          echo "version $proj matches tag $TAG"

      # Notes come verbatim from CHANGELOG.md so the release page and the
      # changelog cannot drift apart.
      - name: Extract release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v want="$version" '
            /^## \[/ {
              if (found) exit
              line = $0
              sub(/^## \[/, "", line)
              sub(/\].*$/, "", line)
              if (line == want) { found = 1 }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Drop leading/trailing blank lines only — interior blanks separate
          # the "### Fixed" / "### Changed" headings and must survive.
          python3 -c 'import pathlib; p = pathlib.Path("release-notes.md"); p.write_text(p.read_text().strip() + "\n")'
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG.md section found for [$version] — add one before tagging"
            exit 1
          fi
          echo "--- notes ---"
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating notes."
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --latest
          fi
